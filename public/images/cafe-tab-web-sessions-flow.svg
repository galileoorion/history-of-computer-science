<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1090" role="img" aria-labelledby="title desc">
  <title id="title">Four requests, one server-side tab</title>
  <desc id="desc">First the browser gets the menu without a cookie. Ordering tea creates a server-side record and returns a Set-Cookie header. Later cake and bill requests carry a Cookie header with the same identifier, so the server finds the record containing tea and cake.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd8060"/></marker>
  </defs>
  <rect width="640" height="1090" rx="22" fill="#f4f0e8"/>
  <text x="34" y="49" fill="#173f4b" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Four requests, one tab</text>
  <text x="34" y="78" fill="#49666b" font-family="Arial, Helvetica, sans-serif" font-size="21">The cookie holds the code; the server holds the orders.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="103" width="592" height="207" rx="18" fill="#fffdf8" stroke="#d5c7b1" stroke-width="2"/>
    <circle cx="65" cy="146" r="25" fill="#c5dce0"/><text x="65" y="154" text-anchor="middle" fill="#153b47" font-size="26" font-weight="700">1</text>
    <text x="106" y="154" fill="#173f4b" font-size="27" font-weight="700">Look at the menu</text>
    <path d="M48 169H592" stroke="#d9e0dd" stroke-width="2"/>
    <text x="49" y="207" fill="#5b7174" font-size="19" font-weight="700">BROWSER</text><text x="186" y="207" fill="#193e49" font-size="23">GET /menu · no cookie</text>
    <text x="49" y="250" fill="#5b7174" font-size="19" font-weight="700">SERVER</text><text x="186" y="250" fill="#193e49" font-size="23">Returns the menu</text>
    <text x="49" y="291" fill="#5b7174" font-size="19" font-weight="700">STORE</text><text x="186" y="291" fill="#193e49" font-size="23">No tab yet</text>

    <path d="M320 313V335" stroke="#bd8060" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="24" y="341" width="592" height="207" rx="18" fill="#fffdf8" stroke="#d5c7b1" stroke-width="2"/>
    <circle cx="65" cy="384" r="25" fill="#efd6ab"/><text x="65" y="392" text-anchor="middle" fill="#574028" font-size="26" font-weight="700">2</text>
    <text x="106" y="392" fill="#173f4b" font-size="27" font-weight="700">Order tea</text>
    <path d="M48 407H592" stroke="#d9e0dd" stroke-width="2"/>
    <text x="49" y="445" fill="#5b7174" font-size="19" font-weight="700">BROWSER</text><text x="186" y="445" fill="#193e49" font-size="23">POST /tab · tea</text>
    <text x="49" y="488" fill="#5b7174" font-size="19" font-weight="700">SERVER</text><text x="186" y="488" fill="#193e49" font-size="23">Set-Cookie: sid=R8x4Q9m2</text>
    <text x="49" y="529" fill="#5b7174" font-size="19" font-weight="700">STORE</text><text x="186" y="529" fill="#193e49" font-size="23">sid → tea</text>

    <path d="M320 551V573" stroke="#bd8060" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="24" y="579" width="592" height="207" rx="18" fill="#fffdf8" stroke="#d5c7b1" stroke-width="2"/>
    <circle cx="65" cy="622" r="25" fill="#efd6ab"/><text x="65" y="630" text-anchor="middle" fill="#574028" font-size="26" font-weight="700">3</text>
    <text x="106" y="630" fill="#173f4b" font-size="27" font-weight="700">Add cake</text>
    <path d="M48 645H592" stroke="#d9e0dd" stroke-width="2"/>
    <text x="49" y="683" fill="#5b7174" font-size="19" font-weight="700">BROWSER</text><text x="186" y="683" fill="#193e49" font-size="23">POST /tab/items · cake</text>
    <text x="49" y="726" fill="#5b7174" font-size="19" font-weight="700">COOKIE</text><text x="186" y="726" fill="#193e49" font-size="23">sid=R8x4Q9m2 returns</text>
    <text x="49" y="767" fill="#5b7174" font-size="19" font-weight="700">STORE</text><text x="186" y="767" fill="#193e49" font-size="23">sid → tea, cake</text>

    <path d="M320 789V811" stroke="#bd8060" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="24" y="817" width="592" height="207" rx="18" fill="#fffdf8" stroke="#d5c7b1" stroke-width="2"/>
    <circle cx="65" cy="860" r="25" fill="#c5dce0"/><text x="65" y="868" text-anchor="middle" fill="#153b47" font-size="26" font-weight="700">4</text>
    <text x="106" y="868" fill="#173f4b" font-size="27" font-weight="700">Ask for the bill</text>
    <path d="M48 883H592" stroke="#d9e0dd" stroke-width="2"/>
    <text x="49" y="921" fill="#5b7174" font-size="19" font-weight="700">BROWSER</text><text x="186" y="921" fill="#193e49" font-size="23">GET /tab · same cookie</text>
    <text x="49" y="964" fill="#5b7174" font-size="19" font-weight="700">SERVER</text><text x="186" y="964" fill="#193e49" font-size="23">Reads the record</text>
    <text x="49" y="1005" fill="#5b7174" font-size="19" font-weight="700">REPLY</text><text x="186" y="1005" fill="#193e49" font-size="23">Tea and cake together</text>
  </g>
  <text x="320" y="1061" text-anchor="middle" fill="#536c70" font-family="Arial, Helvetica, sans-serif" font-size="19">Invented requests and shortened identifier</text>
</svg>
