<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">Three overlapping checks in a seven-bit Hamming code</title>
<desc id="desc">Positions 1 to 7 hold bits 0, 1, 1, 0, 0, 1, 1. Check p1 covers positions 1, 3, 5, 7; p2 covers 2, 3, 6, 7; p4 covers 4, 5, 6, 7.</desc>
