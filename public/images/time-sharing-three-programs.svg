<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Six CPU turns with and without a waiting process</title>
  <desc id="desc">Two six-turn timelines, with each CPU turn lasting 10 milliseconds. When all three processes are ready, the CPU runs Ada, Ben, Cyra, Ada, Ben, Cyra. When Ada waits for keyboard input after her first turn, the CPU runs Ada, Ben, Cyra, Ben, Cyra, Ben instead; no turn is left idle.</desc>
  <rect width="1200" height="510" rx="26" fill="#f3f0e6"/>
  <text x="45" y="60" fill="#23434b" font-family="Arial, sans-serif" font-weight="700" font-size="40">ONE CPU · SIX TURNS</text>
  <text x="958" y="59" fill="#59777a" font-family="Arial, sans-serif" font-size="29">10 ms each</text>
  <text x="48" y="144" fill="#23434b" font-family="Arial, sans-serif" font-weight="700" font-size="34">ALL READY</text>
  <rect x="260" y="109" width="145" height="103" rx="16" fill="#d5a756"/>
  <text x="332.5" y="175" fill="#1d3b42" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">ADA</text>
  <rect x="413" y="109" width="145" height="103" rx="16" fill="#3d7775"/>
  <text x="485.5" y="175" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BEN</text>
  <rect x="566" y="109" width="145" height="103" rx="16" fill="#4c5e84"/>
  <text x="638.5" y="175" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">CYRA</text>
  <rect x="719" y="109" width="145" height="103" rx="16" fill="#d5a756"/>
  <text x="791.5" y="175" fill="#1d3b42" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">ADA</text>
  <rect x="872" y="109" width="145" height="103" rx="16" fill="#3d7775"/>
  <text x="944.5" y="175" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BEN</text>
  <rect x="1025" y="109" width="145" height="103" rx="16" fill="#4c5e84"/>
  <text x="1097.5" y="175" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">CYRA</text>
  <text x="48" y="299" fill="#23434b" font-family="Arial, sans-serif" font-weight="700" font-size="34">ADA WAITS</text>
  <text x="48" y="335" fill="#59777a" font-family="Arial, sans-serif" font-size="31">for input</text>
  <rect x="260" y="264" width="145" height="103" rx="16" fill="#d5a756"/>
  <text x="332.5" y="330" fill="#1d3b42" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">ADA</text>
  <rect x="413" y="264" width="145" height="103" rx="16" fill="#3d7775"/>
  <text x="485.5" y="330" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BEN</text>
  <rect x="566" y="264" width="145" height="103" rx="16" fill="#4c5e84"/>
  <text x="638.5" y="330" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">CYRA</text>
  <rect x="719" y="264" width="145" height="103" rx="16" fill="#3d7775"/>
  <text x="791.5" y="330" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BEN</text>
  <rect x="872" y="264" width="145" height="103" rx="16" fill="#4c5e84"/>
  <text x="944.5" y="330" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">CYRA</text>
  <rect x="1025" y="264" width="145" height="103" rx="16" fill="#3d7775"/>
  <text x="1097.5" y="330" fill="#fff8e9" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">BEN</text>
  <text x="48" y="439" fill="#486c70" font-family="Arial, sans-serif" font-size="38">Ada waits after her first turn.</text>
  <text x="48" y="481" fill="#486c70" font-family="Arial, sans-serif" font-size="38">Ben and Cyra keep the CPU busy.</text>
</svg>
