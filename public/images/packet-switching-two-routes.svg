<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="title desc">
  <title id="title">Three pieces take two routes</title>
  <desc id="desc">A sender at the top and receiver at the bottom are connected through a North depot and a South depot. Pieces 1 and 3 take the northern route; piece 2 takes the southern route. Piece 2 arrives first.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#1d5482" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 11 6 1 11" fill="none" stroke="#a96511" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="560" height="650" rx="20" fill="#f8f7f2"/>
  <text x="280" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#18334b">One transfer, two routes</text>
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M239 170 L154 265" stroke="#1d5482" marker-end="url(#blue-arrow)"/>
    <path d="M159 350 L240 448" stroke="#1d5482" marker-end="url(#blue-arrow)"/>
    <path d="M321 170 L406 265" stroke="#a96511" marker-end="url(#amber-arrow)"/>
    <path d="M401 350 L320 448" stroke="#a96511" marker-end="url(#amber-arrow)"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#18334b" stroke-width="3">
      <rect x="208" y="89" width="144" height="82" rx="18"/>
      <rect x="38" y="265" width="182" height="86" rx="18"/>
      <rect x="340" y="265" width="182" height="86" rx="18"/>
      <rect x="198" y="449" width="164" height="82" rx="18"/>
    </g>
    <g fill="#18334b" font-size="25" font-weight="700">
      <text x="280" y="139">Sender</text>
      <text x="129" y="301"><tspan x="129">North</tspan><tspan x="129" dy="28">depot</tspan></text>
      <text x="431" y="301"><tspan x="431">South</tspan><tspan x="431" dy="28">depot</tspan></text>
      <text x="280" y="499">Receiver</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="60" y="187" width="118" height="40" rx="10" fill="#e7f0f8"/>
    <text x="119" y="214" fill="#1d5482">Pieces 1, 3</text>
    <rect x="382" y="187" width="116" height="40" rx="10" fill="#fff0d9"/>
    <text x="440" y="214" fill="#945a0f">Piece 2</text>
  </g>
  <text x="280" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#455865">Piece 2 arrives first.</text>
  <text x="280" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#455865">TCP restores the byte order.</text>
</svg>
